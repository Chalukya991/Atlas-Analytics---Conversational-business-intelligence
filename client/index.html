<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ask your business data anything. Atlas Analytics turns spreadsheets into verified answers, charts and reports." />
    <meta name="theme-color" content="#f4f6fa" />
    <meta name="color-scheme" content="light dark" />
    <title>Atlas Analytics</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var p = localStorage.getItem('atlas.theme');
        var dark = p === 'dark' || ((p === null || p === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
